# Shared action vocabulary for flight games: jets and planes, arcade or sim.
#
# No keys here: a genre says which ROLES a game has, a game says which keys they are
# bound to. Start a game's actions.yaml with `extends: genres/Flight/actions.yaml`.
#
# `xbox:` is the Xbox pad control a game usually puts the action on. It is never sent:
# it is where the controller-style layout places the action (layouts.yaml, src/lib/xbox.ts).
#
# `keyboard:` is the key or mouse button a game usually puts the action on for someone on a
# keyboard and mouse. Like `xbox:` it is a suggestion, never sent and never written into a
# game by itself: a new game starts with both as its own `kbm:` and `pad:`, and the In-game
# tab's Fill in the usual bindings copies them into a game that has none.
#
# A plane has four control axes -- throttle, pitch, roll and yaw -- against a ship's six,
# so these are the four a DJI-style stick mode puts on two sticks (stick-modes.yaml).
# Nothing is `provided_by: mouse`: a pair of keypads flies with no mouse at all, so firing
# is on keys too.
#
# `required` means you cannot play without it: the checks complain while no control carries
# it. Kept to flying, both weapons and changing target.
genre: Flight

actions:
  # --- flight: the four axes -----------------------------------------------------
  throttle_up:    {label: Accelerate, keyboard: ShiftLeft, xbox: LeftStickUp, tags: [movement, required]}
  throttle_down:  {label: Decelerate, keyboard: ControlLeft, xbox: LeftStickDown, tags: [movement, required]}
  pitch_up:       {label: Pitch up, keyboard: KeyS, xbox: RightStickDown, tags: [movement, required],
                   note: "Nose up. A stick pulled back, in the aircraft convention."}
  pitch_down:     {label: Pitch down, keyboard: KeyW, xbox: RightStickUp, tags: [movement, required],
                   note: "Nose down. A stick pushed forward."}
  roll_left:      {label: Roll left, keyboard: KeyA, xbox: RightStickLeft, tags: [movement, required]}
  roll_right:     {label: Roll right, keyboard: KeyD, xbox: RightStickRight, tags: [movement, required]}
  yaw_left:       {label: Yaw left, keyboard: KeyQ, xbox: LeftStickLeft, tags: [movement]}
  yaw_right:      {label: Yaw right, keyboard: KeyE, xbox: LeftStickRight, tags: [movement]}

  # --- weapons -------------------------------------------------------------------
  fire_gun:       {label: Fire gun, keyboard: Space, xbox: RT, tags: [combat, required]}
  fire_missile:   {label: Fire missile, keyboard: KeyF, xbox: RB, tags: [combat, required]}
  weapon_change:  {label: Change weapon, keyboard: KeyR, xbox: Y, tags: [combat]}
  target_change:  {label: Change target, keyboard: KeyT, xbox: X, tags: [combat, required]}
  flare:          {label: Flare, keyboard: KeyX, xbox: LB, tags: [combat],
                   note: "A countermeasure is pressed in a hurry. Tap only -- constraint 4."}

  # --- view ----------------------------------------------------------------------
  view_change:    {label: Change view, keyboard: KeyV, xbox: A, tags: [utility]}
  camera_up:      {label: Look up, keyboard: KeyI, xbox: DpadUp, tags: [utility]}
  camera_down:    {label: Look down, keyboard: KeyK, xbox: DpadDown, tags: [utility]}
  camera_left:    {label: Look left, keyboard: KeyJ, xbox: DpadLeft, tags: [utility]}
  camera_right:   {label: Look right, keyboard: KeyL, xbox: DpadRight, tags: [utility]}
  radar_map:      {label: Radar map, keyboard: KeyM, xbox: View, tags: [utility]}

  # --- menus ---------------------------------------------------------------------
  menu_main:      {label: Pause, keyboard: Escape, xbox: Menu, tags: [menu],
                   note: "Constraint 5 -- this is Escape. Keep it off anything mashable."}
