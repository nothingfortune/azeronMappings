# What a new flight game starts with: a pair of units, in one of two styles. See
# genres/FPS/layouts.yaml for what each part means.
#
# Both styles fly Mode 2 (stick-modes.yaml): throttle and yaw on the left stick, pitch and
# roll on the right, like a pad's twin sticks and like a flight stick.
controller:
  label: Like a controller
  note: >-
    Mode 2 sticks, RT for the gun, RB for missiles, the d-pad for the camera -- an Xbox pad
    laid over the pair.
  stick_mode: mode2
  acknowledge:
    reason: The thumb pads are a pad's d-pad and its A B X Y, which do different jobs.
    positions: [dpad_up, dpad_down, dpad_left, dpad_right, stick_press, thumb_aux_upper]
  left:
    index_4: {label: Change target, tap: target_change}
  right:
    index_4: {label: Flare, tap: flare}

keyboard:
  label: Like a keyboard
  note: >-
    The genre's one-unit layout on the left, with pitch and roll on keys as well, and the
    right stick for pitch and roll.
  stick_mode: mode2
  left: default
  right:
    index_3: {label: Fire gun, tap: fire_gun}
    index_2: {label: Fire missile, tap: fire_missile}
