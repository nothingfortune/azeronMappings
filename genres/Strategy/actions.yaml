# Shared action vocabulary for strategy games, real-time and grand: Stellaris, Distant
# Worlds 2, Dawn of War, Battlefleet Gothic: Armada, Nebulous: Fleet Command and the like --
# units chosen and ordered with the mouse, groups and orders on keys, time to stop and start.
#
# No keys here: a genre says which ROLES a game has, a game says which keys they are
# bound to. Start a game's actions.yaml with `extends: genres/Strategy/actions.yaml`.
#
# `keyboard:` is the key or mouse button a game usually puts the action on; a suggestion,
# never sent: see genres/FPS/actions.yaml. There is no `xbox:` and no layouts.yaml: these
# games are played with a mouse, so a layout is one unit beside it.
#
# Selecting and ordering are the mouse's, `provided_by` and excluded from the coverage
# check. The stick pans the camera.
genre: Strategy

actions:
  # --- the mouse ----------------------------------------------------------------
  select:         {label: Select, provided_by: mouse, keyboard: MouseLeft, tags: [combat, required]}
  command:        {label: Move / attack order, provided_by: mouse, keyboard: MouseRight, tags: [combat, required]}

  # --- the camera ---------------------------------------------------------------
  camera_up:      {label: Pan up, keyboard: KeyW, tags: [movement]}
  camera_down:    {label: Pan down, keyboard: KeyS, tags: [movement]}
  camera_left:    {label: Pan left, keyboard: KeyA, tags: [movement]}
  camera_right:   {label: Pan right, keyboard: KeyD, tags: [movement]}
  rotate_left:    {label: Rotate left, keyboard: KeyQ, tags: [movement]}
  rotate_right:   {label: Rotate right, keyboard: KeyE, tags: [movement]}
  zoom_in:        {label: Zoom in, keyboard: WheelUp, tags: [movement]}
  zoom_out:       {label: Zoom out, keyboard: WheelDown, tags: [movement]}
  focus:          {label: Centre on selection, keyboard: Backspace, tags: [movement]}

  # --- groups -------------------------------------------------------------------
  group_1:        {label: Group 1, keyboard: Digit1, tags: [combat]}
  group_2:        {label: Group 2, keyboard: Digit2, tags: [combat]}
  group_3:        {label: Group 3, keyboard: Digit3, tags: [combat]}
  group_4:        {label: Group 4, keyboard: Digit4, tags: [combat]}
  group_5:        {label: Group 5, keyboard: Digit5, tags: [combat]}
  select_idle:    {label: Select idle units, keyboard: KeyG, tags: [utility]}

  # --- orders -------------------------------------------------------------------
  attack_move:    {label: Attack move, keyboard: KeyF, tags: [combat]}
  stop:           {label: Stop, keyboard: KeyX, tags: [combat]}
  hold_position:  {label: Hold position, keyboard: KeyH, tags: [combat]}
  retreat:        {label: Retreat, keyboard: KeyR, tags: [combat]}
  ability_1:      {label: Ability 1, keyboard: KeyZ, tags: [combat]}
  ability_2:      {label: Ability 2, keyboard: KeyC, tags: [combat]}
  ability_3:      {label: Ability 3, keyboard: KeyV, tags: [combat]}
  ability_4:      {label: Ability 4, keyboard: KeyB, tags: [combat]}

  # --- time ---------------------------------------------------------------------
  pause:          {label: Pause, keyboard: Space, tags: [utility]}
  speed_up:       {label: Faster, tags: [utility]}
  speed_down:     {label: Slower, tags: [utility]}

  # --- menus --------------------------------------------------------------------
  map:            {label: Map / galaxy view, keyboard: KeyM, tags: [menu]}
  outliner:       {label: Outliner / fleet list, keyboard: KeyL, tags: [menu]}
  research:       {label: Research, keyboard: KeyT, tags: [menu]}
  quick_save:     {label: Quick save, keyboard: F5, tags: [menu]}
  menu_main:      {label: Main menu, keyboard: Escape, tags: [menu],
                   note: "Constraint 5 -- this is Escape. Keep it off anything mashable."}
