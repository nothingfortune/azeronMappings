# Shared action vocabulary for first- and third-person shooters.
#
# No keys here: a genre says which ROLES a game has, a game says which keys they are
# bound to. Start a game's actions.yaml with `extends: genres/FPS/actions.yaml`.
#
# `xbox:` is the Xbox pad control a game usually puts the action on. It is never sent:
# it is where the controller-style layout places the action (layouts.yaml, src/lib/xbox.ts).
#
# Aiming and firing are on the mouse, so they are marked `provided_by` and excluded from
# the coverage check. A layout with no mouse sends them as mouse buttons from keys, which
# the game's actions.yaml says (`provided_by: null`, `mouse: left`).
genre: FPS

actions:
  # --- movement -----------------------------------------------------------------
  move_forward:   {label: Move forward,  xbox: LeftStickUp, tags: [movement, required]}
  move_back:      {label: Move back,     xbox: LeftStickDown, tags: [movement, required]}
  strafe_left:    {label: Strafe left,   xbox: LeftStickLeft, tags: [movement, required]}
  strafe_right:   {label: Strafe right,  xbox: LeftStickRight, tags: [movement, required]}
  sprint:         {label: Sprint,        xbox: LS, tags: [movement],
                   note: "Tempting to latch with isHold; constraint 6 says it stays on
                          until pressed again. Decide deliberately."}
  jump:           {label: Jump,          xbox: A, tags: [movement, required]}
  crouch:         {label: Crouch,        xbox: B, tags: [movement]}
  prone:          {label: Prone,         tags: [movement]}
  dive:           {label: Dive / dodge,  tags: [movement]}
  aim:            {label: Aim,   provided_by: mouse, xbox: LT, tags: [combat]}
  look:           {label: Look,  provided_by: mouse,  axis: mouse_xy, tags: [movement]}
  # Looking on keys, for a pair played with no mouse: the right stick, as on a pad. A
  # keyboard-mode stick turns at one speed, and not every shooter lets look be put on keys.
  look_up:        {label: Look up,       xbox: RightStickUp, tags: [movement]}
  look_down:      {label: Look down,     xbox: RightStickDown, tags: [movement]}
  look_left:      {label: Look left,     xbox: RightStickLeft, tags: [movement]}
  look_right:     {label: Look right,    xbox: RightStickRight, tags: [movement]}

  # --- weapons ------------------------------------------------------------------
  fire_primary:   {label: Fire,          provided_by: mouse, xbox: RT, tags: [combat, required]}
  reload:         {label: Reload,        xbox: X, tags: [combat, required]}
  melee:          {label: Melee,         xbox: RS, tags: [combat]}
  grenade:        {label: Grenade,       xbox: RB, tags: [combat]}
  weapon_1:       {label: Weapon 1,      tags: [combat]}
  weapon_2:       {label: Weapon 2,      tags: [combat]}
  weapon_3:       {label: Sidearm,       tags: [combat]}
  weapon_next:    {label: Next weapon,   xbox: Y, tags: [combat]}
  weapon_prev:    {label: Previous weapon, tags: [combat]}
  ability_1:      {label: Ability 1,     xbox: LB, tags: [combat]}
  ability_2:      {label: Ability 2,     tags: [combat]}
  ability_3:      {label: Ability 3,     tags: [combat]}
  ability_4:      {label: Ability 4,     tags: [combat]}
  equipment_1:    {label: Equipment 1,   xbox: DpadRight, tags: [combat]}
  equipment_2:    {label: Equipment 2,   tags: [combat]}
  stim:           {label: Stim / heal,   xbox: DpadDown, tags: [combat]}

  # --- utility ------------------------------------------------------------------
  interact:       {label: Interact / use, tags: [utility, required]}
  ping:           {label: Ping / mark,    xbox: DpadUp, tags: [utility]}
  flashlight:     {label: Flashlight,     xbox: DpadLeft, tags: [utility]}
  push_to_talk:   {label: Push to talk,   tags: [utility]}

  # --- menus --------------------------------------------------------------------
  map:            {label: Map,            tags: [menu]}
  inventory:      {label: Inventory,      tags: [menu]}
  scoreboard:     {label: Scoreboard,     xbox: View, tags: [menu]}
  emote:          {label: Emote wheel,    tags: [menu]}
  menu_main:      {label: Main menu,      xbox: Menu, tags: [menu],
                   note: "Constraint 5 -- this is Escape. Keep it off anything mashable."}
