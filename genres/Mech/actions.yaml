# Shared action vocabulary for mech games: Armored Core VI and the like -- a machine with a
# weapon in each hand and one on each shoulder, boosting about faster than it can turn.
#
# No keys here: a genre says which ROLES a game has, a game says which keys they are
# bound to. Start a game's actions.yaml with `extends: genres/Mech/actions.yaml`.
#
# `xbox:` is the Xbox pad control a game usually puts the action on, and `keyboard:` the key
# or mouse button on a keyboard and mouse. Both are suggestions, never sent: see
# genres/FPS/actions.yaml.
#
# The four weapons are keys of their own, not the mouse's: a mech game binds each to a
# button, and a pair of keypads fires them with no mouse at all. Only turning the camera
# with a mouse is `provided_by`.
genre: Mech

actions:
  # --- movement -----------------------------------------------------------------
  move_forward:   {label: Move forward, keyboard: KeyW, xbox: LeftStickUp, tags: [movement, required]}
  move_back:      {label: Move back, keyboard: KeyS, xbox: LeftStickDown, tags: [movement, required]}
  move_left:      {label: Move left, keyboard: KeyA, xbox: LeftStickLeft, tags: [movement, required]}
  move_right:     {label: Move right, keyboard: KeyD, xbox: LeftStickRight, tags: [movement, required]}
  jump:           {label: Jump / ascend, keyboard: Space, xbox: A, tags: [movement, required]}
  boost:          {label: Boost on / off, keyboard: ControlLeft, xbox: LS, tags: [movement],
                   note: "A toggle in the game. Constraint 6: never latch it on the keypad as well."}
  quick_boost:    {label: Quick boost, keyboard: ShiftLeft, xbox: B, tags: [movement, required]}
  assault_boost:  {label: Assault boost, keyboard: KeyX, xbox: X, tags: [movement]}
  look:           {label: Look, provided_by: mouse, axis: mouse_xy, tags: [movement]}
  look_up:        {label: Look up, xbox: RightStickUp, tags: [movement]}
  look_down:      {label: Look down, xbox: RightStickDown, tags: [movement]}
  look_left:      {label: Look left, xbox: RightStickLeft, tags: [movement]}
  look_right:     {label: Look right, xbox: RightStickRight, tags: [movement]}

  # --- weapons ------------------------------------------------------------------
  left_arm:       {label: Left arm weapon, keyboard: MouseLeft, xbox: LT, tags: [combat, required]}
  right_arm:      {label: Right arm weapon, keyboard: MouseRight, xbox: RT, tags: [combat, required]}
  left_back:      {label: Left back weapon, keyboard: KeyQ, xbox: LB, tags: [combat]}
  right_back:     {label: Right back weapon, keyboard: KeyE, xbox: RB, tags: [combat]}
  left_bay:       {label: Swap left weapon bay, keyboard: KeyZ, tags: [combat]}
  right_bay:      {label: Swap right weapon bay, keyboard: KeyC, tags: [combat]}
  hard_lock:      {label: Hard lock, keyboard: MouseMiddle, xbox: RS, tags: [combat]}
  core_expansion: {label: Core expansion, keyboard: KeyG, xbox: DpadRight, tags: [combat]}
  repair:         {label: Repair kit, keyboard: KeyR, xbox: Y, tags: [combat],
                   note: "Pressed in a hurry. Tap only -- constraint 4."}

  # --- utility ------------------------------------------------------------------
  scan:           {label: Scan, keyboard: KeyF, xbox: DpadUp, tags: [utility]}
  interact:       {label: Interact, keyboard: KeyT, xbox: DpadDown, tags: [utility]}
  camera_reset:   {label: Reset camera, keyboard: KeyV, xbox: DpadLeft, tags: [utility]}

  # --- menus --------------------------------------------------------------------
  map:            {label: Map / mission, keyboard: Tab, xbox: View, tags: [menu]}
  menu_main:      {label: Main menu, keyboard: Escape, xbox: Menu, tags: [menu],
                   note: "Constraint 5 -- this is Escape. Keep it off anything mashable."}
