# Default single-unit layout for a party RPG, with the mouse in the other hand.
#
# The stick pans the camera; the hotbar is under the fingers, ten keys in order across the
# index, middle and ring rows; the party is on the pinkies; the thumb rotates the camera and
# ends the turn. Menus are on the bottom row. Tap only (constraints 4 and 6).
profile:
  name: RPG default (left)
  device: cyborg2-left
  unit: left
  set: RPG-default

lint:
  require_keyboard_stick: true

positions:
  stick:
    mode: keyboard
    directions: {up: camera_up, right: camera_right, down: camera_down, left: camera_left}

  # The hotbar, 1 to 10.
  index_1: {label: Hotbar 1, tap: hotbar_1}
  index_2: {label: Hotbar 2, tap: hotbar_2}
  index_3: {label: Hotbar 3, tap: hotbar_3}
  index_4: {label: Hotbar 4, tap: hotbar_4}
  middle_1: {label: Hotbar 5, tap: hotbar_5}
  middle_2: {label: Hotbar 6, tap: hotbar_6}
  middle_3: {label: Hotbar 7, tap: hotbar_7}
  middle_4: {label: Hotbar 8, tap: hotbar_8}
  ring_1: {label: Hotbar 9, tap: hotbar_9}
  ring_2: {label: Hotbar 10, tap: hotbar_10}
  ring_3: {label: Jump, tap: jump}
  ring_4: {label: Sneak, tap: sneak}

  # Pinky bank: the party.
  pinky_1: {label: Character 1, tap: character_1}
  pinky_2: {label: Character 2, tap: character_2}
  pinky_3: {label: Character 3, tap: character_3}
  pinky_4: {label: Character 4, tap: character_4}

  # Side keys.
  pinky_side: {label: Show usable, tap: highlight}
  index_side: {label: Turn-based mode, tap: toggle_combat}

  # Thumb pad: the camera, and the turn.
  dpad_left:  {label: Rotate left, tap: rotate_left}
  dpad_right: {label: Rotate right, tap: rotate_right}
  dpad_up:    {label: Centre camera, tap: camera_centre}
  dpad_press: {label: End turn, tap: end_turn}

  # Bottom row: menus only.
  pinky_5:  {label: Main menu, tap: menu_main}
  ring_5:   {label: Journal, tap: journal}
  middle_5: {label: Inventory, tap: inventory}
  index_5:  {label: Map, tap: map}
