name: Ace Combat 7
slug: aceCombat7
genre: Flight
template: templates/everspace2-akimbo-left.json

# No ingame_config: the repo does not write Ace Combat 7's bindings. actions.yaml carries
# the game's own default keyboard keys, so the units work with the game as installed;
# a key changed in the game's Options > Keyboard is a one-line edit there.

lint:
  # The compiler can only write a stick in keyboard mode, and a stick in gamepad mode next
  # to keyboard keys is what made Everspace 2 flip input modes (constraint 1).
  require_keyboard_stick: true

  acknowledged:
    - {profile: default-left, rule: duplicate-output-key, key: KeyS,
       reason: "Decelerate on index_1 as well as the stick, on purpose: a high-G turn is both
                throttle keys held, and a stick can send only one of them at a time. The two
                are one S to the game, so letting go of either lets go of S: use index_1 with
                the stick pushed up (accelerate), not pulled down."}
