name: Helldivers 2
slug: hellDivers
genre: FPS
template: templates/everspace2-akimbo-left.json

# No ingame_config: the repo does not write Helldivers 2's bindings (input_settings.config
# under Steam's userdata/<id>/553850/remote). actions.yaml carries the game's own default
# keys, which the owner's file has not changed, so the unit works with the game as
# installed. A key rebound in the game is a one-line edit there.

lint:
  # The compiler can only write a stick in keyboard mode, and a stick in gamepad mode next
  # to keyboard and mouse is what made Everspace 2 flip input modes (constraint 1).
  require_keyboard_stick: true
