# Elite Dangerous -- every control the game has, as an action, with the key it is sent on.
#
# Made from the game's own bindings files: every button control in every installed preset
# (ControlSchemes/*.binds) and in the owner's old Custom file, 358 in all. Axis
# controls are not here: a key cannot drive one. `ingame` is the control's name in the
# game's file; `mode` is the mode of play it belongs to; the keys are the ones the game's
# own KeyboardMouseOnly preset gives, where the keypad can send them, and an action with
# none is given one by the editor when it is first put on a control.
#
# A key is one thing in each mode of play. Actions in modes that are never live together
# (sets.yaml says which: a layout per mode) may share a key; within one they may not.
