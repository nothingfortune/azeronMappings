# Everspace 2 -- akimbo v10, RIGHT unit. The flying hand: thrust and strafe on the stick,
# pitch and roll on the pad, devices on the fingers.
#
# Mode 2 with pedals on the sticks, from genres/SpaceSims/stick-modes.yaml: the left stick
# climbs and banks (hover, roll); the right stick flies forward and strafes (thrust,
# strafe). Yaw is on the rudder pedals (games/SpaceSims/everspace/sets.yaml). The right
# thumb pad pitches and rolls, so all six axes are on the pair plus the feet and the
# pointer is left to aim.
#
# Every label is the action's own, so the cheatsheet and the app say what the key does.
# Up to v9 the keys labelled weapon cycling sent the arrows, which the game has on pitch
# and yaw; they now send the weapon actions they were meant to. The in-game half is
# generated from actions.yaml (`azeron ingame --apply`), so these keys are what the game
# listens for.
#
# EXPERIMENT: middle_1 and middle_4 send thrust forward as a repeated key, at two
# intervals, so a pulsed press can be compared against the stick holding it. What a
# pulsed key does depends on inertia dampeners: on, it averages to part power; off, the
# ship coasts between pulses and only reaches full speed more slowly. Note the dampener
# state on every run. Delete both keys and the acknowledgement together once judged.
#
# Source export: templates/everspace2-akimbo-right.json
profile:
  id: 03e60aef-5647-4d2f-8ede-3436552761d5
  name: Everspace 2 akimbo v10 (right)
  device: cyborg2-right
  unit: right
  template: templates/everspace2-akimbo-right.json
  set: akimbo-v10
  output: everspace_akimbo_v10_right.json
  sensor: false
positions:
  pinky_5:
    label: Map
    tap: map
  ring_5:
    label: Crafting
    tap: crafting
  index_5:
    label: Data / logs
    tap: data_logs
  thumb_aux_upper:
    label: Jump / supralight drive
    tap: supralight
  stick:
    mode: keyboard
    directions: { up: pitch_up, right: yaw_right, down: pitch_down, left: yaw_left }
  index_4:
    tap: fire_primary
    label: Fire primary
  middle_4:
    tap: fire_secondary
    label: Fire secondary
  index_2:
    tap: next_primary
    label: Next primary
  middle_2:
    tap: next_secondary
    label: Next secondary
  index_side:
    tap: interact
    label: Interact / fling
  pinky_side:
    tap: view_ship
    label: Switch camera
  dpad_right:
    tap: next_target
    label: Next target
  dpad_left:
    tap: previous_target
    label: Previous target
  index_1:
    tap: previous_primary
    label: Previous primary
  middle_3:
    tap: use_device_hold
    label: Device wheel (hold)
  dpad_down:
    tap: lock_nearest_target
    label: Lock nearest target
  dpad_up:
    label: Lock target
    tap: lock_target
  middle_1:
    tap: previous_secondary
    label: Previous secondary
  middle_5:
    label: Inventory
    tap: inventory
  ring_4:
    tap: ultimate
    label: Ultimate
