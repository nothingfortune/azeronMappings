# Everspace 2 -- akimbo v6 draft, RIGHT unit (SUPERSEDED by v7) (attitude, devices and targeting).
#
# DRAFT: not playtested. Pairs with akimbo-v6-left.yaml; see that file for the design.
#
# PRESS-TEST BEFORE TRUSTING (the right unit is mirrored hardware):
#   * the stick's left/right directions -- roll is direction-sensitive and a swap is not
#     obvious until you are already rolling the wrong way;
#   * the thumb pad. Nothing directional is bound there for exactly this reason: the four
#     pad keys carry devices 1-4, which do not care which way is which.
#
# Built from the left unit's export (templates/everspace2-v5.json) because the pins match.
# Confirm on import that the right unit accepts it; `metaData.device` in the template is
# an unexplained field that may encode the unit.
profile:
  id: af9838e4-793a-4c15-8e96-2bce2d8fb8ff
  name: Everspace 2 akimbo v6 (right)
  device: cyborg2-right
  unit: right
  set: akimbo-v6
  template: templates/everspace2-v5.json
  output: everspace_akimbo_right.json

positions:
  # Roll on the horizontal, weapon cycling on the vertical.
  stick:
    mode: keyboard
    directions: {up: weapon_cycle_up, right: roll_right, down: weapon_cycle_down, left: roll_left}

  # Pinky bank mirrors the left hand's consumables with the rest of the weapon cycling.
  pinky_1: {label: Cycle weapon left, tap: weapon_cycle_left}
  pinky_2: {label: Cycle weapon right, tap: weapon_cycle_right}

  # Vertical thrust, and flight assist on the resting index row opposite Boost.
  index_1: {label: Hover up, tap: hover_up}
  index_2: {label: Hover down, tap: hover_down}
  index_3: {label: Inertia dampeners, tap: inertia_dampeners}

  middle_3: {label: View ship, tap: view_ship}

  # Thumb pad: the device bank, opposite the left hand's primaries.
  dpad_up:     {label: Device 1, tap: device_1}
  dpad_left:   {label: Device 2, tap: device_2}
  dpad_right:  {label: Device 3, tap: device_3}
  dpad_down:   {label: Device 4, tap: device_4}
  dpad_press: {label: Lock target, tap: lock_target}

  thumb_aux_upper: {label: Supralight drive, tap: supralight}

  # Bottom row: menus only, on both hands.
  pinky_5:  {label: Map, tap: map}
  ring_5:   {label: Crafting, tap: crafting}
  middle_5: {label: Inventory, tap: inventory}
  index_5:  {label: Data / logs, tap: data_logs}
