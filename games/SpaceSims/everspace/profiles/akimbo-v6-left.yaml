# Everspace 2 -- akimbo v6 draft, LEFT unit (SUPERSEDED by v7) (flight and guns).
#
# DRAFT: not playtested. The 2026-09-28 akimbo attempt failed two ways, and this layout
# is built against both of them:
#   * every action in actions.yaml is bound across the pair, so there is nothing left to
#     reach for a gamepad for;
#   * mirrored positions carry the same role on both hands -- the same finger does an
#     analogous job, even though the action differs.
#
# Tap only. No long-press, no double-tap, no isHold anywhere in the pair, so nothing
# waits on featureDelay (constraint 4) and nothing latches (constraint 6).
#
# The two sticks are the one deliberate asymmetry: the left flies, the right rolls and
# cycles weapons. Sticks are not covered by the mirror rule; this is the first thing to
# judge in a playtest.
profile:
  id: 8d3ad31a-0ed0-446f-ae66-19fe4a9403b0
  name: Everspace 2 akimbo v6 (left)
  device: cyborg2-left
  unit: left
  set: akimbo-v6
  template: templates/everspace2-v5.json
  output: everspace_akimbo_left.json

positions:
  # Flight axes. Keyboard mode only -- constraint 1.
  stick:
    mode: keyboard
    directions: {up: throttle_up, right: strafe_right, down: throttle_down, left: strafe_left}

  # Pinky bank: consumables (right hand mirrors with weapon cycling -- both combat).
  pinky_1: {label: Consumable 1, tap: consume_1}
  pinky_2: {label: Consumable 2, tap: consume_2}
  pinky_3: {label: Consumable 3, tap: consume_3}
  pinky_4: {label: Consumable 4, tap: consume_4}

  # Resting rows: the two keys pressed most often in a fight.
  middle_3: {label: Interact / fling, tap: interact}
  index_3:  {label: Boost, tap: boost}

  # Thumb pad: the primary bank. v5 put weapon cycling here behind a 1000 ms long-press;
  # these are taps.
  thumb_up:     {label: Primary 1, tap: primary_1}
  thumb_left:   {label: Primary 2, tap: primary_2}
  thumb_right:  {label: Primary 3, tap: primary_3}
  thumb_down:   {label: Next target, tap: next_target}
  thumb_center: {label: Ultimate, tap: ultimate}

  # Thumb aux.
  thumb_aux_upper: {label: Cruise drive, tap: cruise}
  thumb_aux_lower: {label: Place marker, tap: place_marker}
  stick_press: {label: Menu (Tab), tap: menu_tab}

  # Bottom row: menus only, on both hands.
  pinky_5:  {label: Missions, tap: missions}
  ring_5:   {label: Perks, tap: perks}
  middle_5: {label: Ship, tap: ship_menu}
  index_5:  {label: Escape menu, tap: escape_menu}
