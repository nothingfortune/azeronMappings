# Everspace 2 -- akimbo v9, RIGHT unit.
#
# The sticks fly instead of selecting. The imported layout had both sticks cycling
# weapons while thrust sat on a d-pad, which puts the discrete job on the only input
# that is not discrete. Stick mode 2: the right stick thrusts and strafes, the left
# climbs and rolls.
#
# Weapon cycling moves to four keys, on positions the thrust and cycle bindings vacated.
# The left unit's sensor aims; the right unit's is off so only one drives the pointer.
#
# EXPERIMENT: middle_1 and middle_4 send thrust forward as a repeated key, at two
# intervals, so a pulsed press can be compared against the stick holding it. A repeated
# key is down part of the time, which for an action the game reads as on/off averages to
# part power. Delete both and the acknowledgement in game.yaml together once judged.
#
# Source export: templates/everspace2-akimbo-right.json
