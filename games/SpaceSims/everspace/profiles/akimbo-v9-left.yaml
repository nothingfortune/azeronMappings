# Everspace 2 -- akimbo v9, LEFT unit.
#
# The sticks fly instead of selecting. The imported layout had both sticks cycling
# weapons while thrust sat on a d-pad, which puts the discrete job on the only input
# that is not discrete. Stick mode 2: the right stick thrusts and strafes, the left
# climbs and rolls.
#
# Weapon cycling moves to four keys, on positions the thrust and cycle bindings vacated.
# The left unit's sensor aims; the right unit's is off so only one drives the pointer.
#
# Source export: templates/everspace2-akimbo-left.json
profile:
  id: 52ea554b-bdb5-4cb4-9347-8451c44e7864
  name: Everspace 2 akimbo v9 (left)
  device: cyborg2-left
  unit: left
  template: templates/everspace2-akimbo-left.json
  set: akimbo-v9
  output: everspace_akimbo_v9_left.json
  sensor: true
positions:
  pinky_1:
    label: Esc
    tap: escape_menu
  pinky_2:
    label: Consumable 4
    tap: consume_4
  pinky_3:
    label: Consumable 5
    tap: consume_1
  pinky_4:
    label: Interact / fling
    tap: interact
  ring_2:
    label: Consumable 3
    tap: consume_3
  ring_3:
    label: R
    tap: next_secondary
  ring_4:
    label: Secondary 3
    tap: secondary_3
  ring_5:
    label: Missions
    tap: missions
  middle_1:
    label: Menu (Tab)
    tap: menu_tab
  middle_2:
    label: Consumable 2
    tap: consume_2
  middle_4:
    label: Secondary 2
    tap: secondary_2
  middle_5:
    label: Perks
    tap: perks
  index_1:
    label: Next target
    tap: secondary_1
  index_2:
    label: Consumable 1
    tap: consume_1
  index_3:
    label: Fire Secondary
    tap: fire_secondary
  index_4:
    label: Secondary 1
    tap: secondary_1
  index_5:
    label: Ship
    tap: ship_menu
  pinky_side:
    label: Escape menu
    tap: escape_menu
  index_side:
    label: Boost
    tap: boost
  dpad_up:
    label: Cycle weapon up
    tap: pitch_up
  dpad_left:
    label: Prev Primary
    tap: previous_primary
  dpad_press:
    label: Ultimate
    tap: ultimate
  dpad_right:
    label: Next Primary
    tap: next_primary
  dpad_down:
    label: Cycle weapon down
    tap: pitch_down
  thumb_aux_upper:
    label: Cruise drive
    tap: cruise
  thumb_aux_lower:
    label: Place marker
    tap: place_marker
  stick_press:
    label: Inertial Dampen
    tap: inertia_dampeners
  stick:
    mode: keyboard
    directions:
      up: hover_up
      right: roll_right
      down: hover_down
      left: roll_left
  ring_1:
    label: Cycle weapon left
    tap: yaw_left
  middle_3:
    label: Cycle weapon right
    tap: yaw_right
