name: Everspace 2
slug: everspace
genre: SpaceSims
template: templates/everspace2-v5.json

# The game's own binding file. `azeron ingame` reads it to compare against actions.yaml.
ingame_config: "/mnt/c/Users/there/AppData/Local/ES2/Saved/Config/Windows/Input.ini"

lint:
  # Constraint 1: a stick in gamepad/analog mode made the game flip between gamepad and
  # keyboard/mouse input and stuttered the frame rate. Keyboard mode only.
  require_keyboard_stick: true

  # Findings that are real but accepted on a specific profile. Each one is a decision,
  # not a mute: say why, and revisit it when that profile is revised.
  acknowledged:
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: dpad_down,
       reason: "v8 and v9 specialise the hands rather than mirroring them: the right unit flies and the left fights. A deliberate departure from the 2026-09-28 lesson, and what a playtest has to judge."}
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: dpad_left,
       reason: "v8 and v9 specialise the hands rather than mirroring them: the right unit flies and the left fights. A deliberate departure from the 2026-09-28 lesson, and what a playtest has to judge."}
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: dpad_press,
       reason: "v8 and v9 specialise the hands rather than mirroring them: the right unit flies and the left fights. A deliberate departure from the 2026-09-28 lesson, and what a playtest has to judge."}
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: dpad_right,
       reason: "v8 and v9 specialise the hands rather than mirroring them: the right unit flies and the left fights. A deliberate departure from the 2026-09-28 lesson, and what a playtest has to judge."}
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: dpad_up,
       reason: "v8 and v9 specialise the hands rather than mirroring them: the right unit flies and the left fights. A deliberate departure from the 2026-09-28 lesson, and what a playtest has to judge."}
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: index_2,
       reason: "v8 and v9 specialise the hands rather than mirroring them: the right unit flies and the left fights. A deliberate departure from the 2026-09-28 lesson, and what a playtest has to judge."}
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: index_4,
       reason: "v8 and v9 specialise the hands rather than mirroring them: the right unit flies and the left fights. A deliberate departure from the 2026-09-28 lesson, and what a playtest has to judge."}
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: pinky_1,
       reason: "v8 and v9 specialise the hands rather than mirroring them: the right unit flies and the left fights. A deliberate departure from the 2026-09-28 lesson, and what a playtest has to judge."}
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: pinky_side,
       reason: "v8 and v9 specialise the hands rather than mirroring them: the right unit flies and the left fights. A deliberate departure from the 2026-09-28 lesson, and what a playtest has to judge."}
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: thumb_aux_lower,
       reason: "v8 and v9 specialise the hands rather than mirroring them: the right unit flies and the left fights. A deliberate departure from the 2026-09-28 lesson, and what a playtest has to judge."}
    - {profile: akimbo-v9-left, rule: duplicate-output-key, key: Digit5,
       reason: "Deliberate: the action is reachable from more than one position in this layout."}
    - {profile: akimbo-v9-left, rule: duplicate-output-key, key: Escape,
       reason: "Deliberate: the action is reachable from more than one position in this layout."}
    - {profile: akimbo-v9-left, rule: duplicate-output-key, key: F4,
       reason: "Deliberate: the action is reachable from more than one position in this layout."}
    - {profile: akimbo-v9-right, rule: duplicate-output-key, key: KeyA,
       reason: "Deliberate: the action is reachable from more than one position in this layout."}
    - {profile: akimbo-v9-right, rule: duplicate-output-key, key: KeyD,
       reason: "Deliberate: the action is reachable from more than one position in this layout."}
    - {profile: akimbo-v9-right, rule: duplicate-output-key, key: KeyS,
       reason: "Deliberate: the action is reachable from more than one position in this layout."}
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: middle_1,
       reason: "EXPERIMENT: middle_1 and middle_4 carry pulsed thrust on the right unit,
                opposite menu and combat keys on the left. They exist to be flown and
                deleted, not to be mirrored."}
    - {profile: akimbo-v9, rule: akimbo-role-mismatch, position: middle_4,
       reason: "EXPERIMENT: as middle_1 -- pulsed thrust, pending a playtest."}
    - {profile: akimbo-v9-right, rule: duplicate-output-key, key: KeyW,
       reason: "EXPERIMENT: thrust forward is on four inputs on purpose -- the stick, a
                key from the imported layout, and two pulsed keys at different intervals
                -- so they can be compared in one session. Delete the pulsed keys and
                this line together once judged."}
    - {profile: single-v5, rule: duplicate-output-key, key: Tab,
       reason: "Tab reaches the menu from two places (perks double-tap, ULT long-press).
                Both are menu actions, so there is no combat ambiguity."}
    - {profile: single-v5, rule: duplicate-output-key, key: KeyI,
       reason: "Inventory from the ship menu key and from the thumb pad; deliberate."}
    - {profile: single-v5, rule: combat-tap-delayed, position: dpad_press,
       reason: "Baseline v5 as shipped: ULT waits 1000 ms for the long-press window.
                Constraint 4 says this is wrong; fix it in v6 rather than silence it."}
    - {profile: single-v5, rule: combat-tap-delayed, position: dpad_up,
       reason: "Baseline v5: weapon cycling delayed 1000 ms by the crafting long-press."}
    - {profile: single-v5, rule: combat-tap-delayed, position: dpad_down,
       reason: "Baseline v5: weapon cycling delayed 1000 ms by the inventory long-press."}
    - {profile: single-v5, rule: combat-tap-delayed, position: dpad_left,
       reason: "Baseline v5: weapon cycling delayed 1000 ms by the map long-press."}
    - {profile: single-v5, rule: combat-tap-delayed, position: dpad_right,
       reason: "Baseline v5: weapon cycling delayed 1000 ms by the data long-press."}
    - {profile: single-v5, rule: menu-with-combat, position: dpad_press,
       reason: "Tab on long-press next to the ULT tap. Tab is not Escape, and the pad is
                not mashed the way a consumable is, but it is on the v6 review list."}
    - {profile: single-v5, rule: menu-with-combat, position: dpad_up,
       reason: "Crafting menu long-press shares the key with weapon cycling; v6 review."}
    - {profile: single-v5, rule: menu-with-combat, position: dpad_down,
       reason: "Inventory long-press shares the key with weapon cycling; v6 review."}
    - {profile: single-v5, rule: menu-with-combat, position: dpad_left,
       reason: "Map long-press shares the key with weapon cycling; v6 review."}
    - {profile: single-v5, rule: menu-with-combat, position: dpad_right,
       reason: "Data long-press shares the key with weapon cycling; v6 review."}
