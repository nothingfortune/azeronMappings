# Shared action vocabulary for first- and third-person shooters.
#
# No keys here: a genre says which ROLES a game has, a game says which keys they are
# bound to. Start a game's actions.yaml with `extends: genres/FPS/actions.yaml`.
#
# Aiming and firing stay on the mouse, so they are marked
# `provided_by` and excluded from the coverage check.
genre: FPS

actions:
  # --- movement -----------------------------------------------------------------
  move_forward:   {label: Move forward, keyboard: KeyW, xbox: LeftStickUp, tags: [movement, required]}
  move_back:      {label: Move back, keyboard: KeyS, xbox: LeftStickDown, tags: [movement, required]}
  strafe_left:    {label: Strafe left, keyboard: KeyA, xbox: LeftStickLeft, tags: [movement, required]}
  strafe_right:   {label: Strafe right, keyboard: KeyD, xbox: LeftStickRight, tags: [movement, required]}
  sprint:         {label: Sprint, keyboard: ShiftLeft, xbox: LS, tags: [movement, required],
                   note: "Tempting to latch with isHold; constraint 6 says it stays on
                          until pressed again. Decide deliberately."}
  jump:           {label: Jump, keyboard: Space, xbox: A, tags: [movement, required]}
  crouch:         {label: Crouch, keyboard: ControlLeft, xbox: B, tags: [movement, required]}
  prone:          {label: Prone, keyboard: KeyZ, tags: [movement]}
  dive:           {label: Dive / dodge, keyboard: AltLeft, tags: [movement]}
  aim:            {label: Aim, keyboard: MouseRight, provided_by: mouse, xbox: LT, tags: [combat, required]}
  look:           {label: Look,  provided_by: mouse,  axis: mouse_xy, tags: [movement, required]}
  look_up:        {label: Look up,       xbox: RightStickUp, tags: [movement]}
  look_down:      {label: Look down,     xbox: RightStickDown, tags: [movement]}
  look_left:      {label: Look left,     xbox: RightStickLeft, tags: [movement]}
  look_right:     {label: Look right,    xbox: RightStickRight, tags: [movement]}

  # --- weapons ------------------------------------------------------------------
  fire_primary:   {label: Fire, keyboard: MouseLeft, provided_by: mouse, xbox: RT, tags: [combat, required]}
  reload:         {label: Reload, keyboard: KeyR, xbox: X, tags: [combat, required]}
  melee:          {label: Melee, keyboard: KeyV, xbox: RS, tags: [combat, required]}
  grenade:        {label: Grenade, keyboard: KeyG, xbox: RB, tags: [combat, required]}
  weapon_1:       {label: Weapon 1, keyboard: Digit1, tags: [combat, required]}
  weapon_2:       {label: Weapon 2, keyboard: Digit2, tags: [combat, required]}
  weapon_3:       {label: Sidearm, keyboard: Digit3, tags: [combat, required]}
  weapon_next:    {label: Next weapon, keyboard: WheelDown, xbox: Y, tags: [combat]}
  weapon_prev:    {label: Previous weapon, keyboard: WheelUp, tags: [combat]}
  ability_1:      {label: Ability 1, keyboard: KeyQ, xbox: LB, tags: [combat, required]}
  ability_2:      {label: Ability 2, keyboard: KeyX, tags: [combat, required]}
  ability_3:      {label: Ability 3, keyboard: KeyC, tags: [combat]}
  ability_4:      {label: Ability 4, keyboard: KeyB, tags: [combat]}
  equipment_1:    {label: Equipment 1, keyboard: Digit4, xbox: DpadRight, tags: [combat]}
  equipment_2:    {label: Equipment 2, keyboard: Digit5, tags: [combat]}
  stim:           {label: Stim / heal, keyboard: KeyH, xbox: DpadDown, tags: [combat, required]}

  # --- utility ------------------------------------------------------------------
  interact:       {label: Interact / use, keyboard: KeyE, tags: [utility, required]}
  ping:           {label: Ping / mark, keyboard: MouseMiddle, xbox: DpadUp, tags: [utility, required]}
  flashlight:     {label: Flashlight, keyboard: KeyF, xbox: DpadLeft, tags: [utility]}
  push_to_talk:   {label: Push to talk, keyboard: KeyT, tags: [utility, required]}

  # --- menus --------------------------------------------------------------------
  map:            {label: Map, keyboard: KeyM, tags: [menu, required]}
  inventory:      {label: Inventory, keyboard: KeyI, tags: [menu, required]}
  scoreboard:     {label: Scoreboard, keyboard: Tab, xbox: View, tags: [menu]}
  emote:          {label: Emote wheel, keyboard: KeyJ, tags: [menu]}
  menu_main:      {label: Main menu, keyboard: Escape, xbox: Menu, tags: [menu, required],
                   note: "Constraint 5 -- this is Escape. Keep it off anything mashable."}
