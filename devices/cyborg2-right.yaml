# Azeron Cyborg II -- right-handed (mirrored) unit.
#
# PRESS-TESTED 2026-09-28 with `azeron probe`, both passes. Every pin below is an
# observation, not an inheritance from the left-hand map.
#
# WHAT THE TEST FOUND: the right unit IS a 1:1 mirror of the left everywhere except the
# thumb cluster, which is mounted half a turn round. 26 of the 30 pressable positions
# report the same pin as the left unit. The four that differ are the thumb pad, and they
# differ as a clean 180-degree rotation:
#
#     thumb_up    34 -> 36     (what the left calls thumb_down)
#     thumb_down  36 -> 34
#     thumb_left  35 -> 33     (what the left calls thumb_right)
#     thumb_right 33 -> 35
#
# The stick is rotated the same 180 degrees: the zero pass measured up->down,
# right->left, down->up, left->right, matching a 180-degree rotation set in the app.
#
# That rotation is corrected ONCE, in firmware, via stick_angle below. Do not also set
# stick_directions: the two are different fixes for the same rotation and applying both
# cancels out. `azeron lint` errors if you try.
#
# OPEN QUESTION: is row 3 the resting row on this unit too?

device: cyborg2-right
# The id the Azeron software files this unit under, in
# Storage/DevicesStorage/<id>/ProfileStorage. Both units report USB PID 12f7.
software_device_id: "29993"
hand: right
mirrored: true

# Press-tested: all 30 pressable positions confirmed; see the header for the four
# thumb-pad pins that differ from the left unit.
verified: true

# Measured by the zero pass and confirmed against the app's own stick rotation control.
# Written to analogSettings.angle, in degrees, set absolutely rather than added.
stick_angle: 180
stick_zero: down

# Pins that exist in exports but whose physical key is unidentified. The compiler
# never writes to these -- their records pass through from the template untouched.
# The press test never saw them fire, which is why they are still here.
unknown_pins: [0, 28, 29]

positions:
  pinky_1: {pin: 5, col: pinky, row: 1}
  pinky_2: {pin: 4, col: pinky, row: 2}
  pinky_3: {pin: 3, col: pinky, row: 3}
  pinky_4: {pin: 2, col: pinky, row: 4}
  pinky_5: {pin: 1, col: pinky, row: 5}
  ring_1: {pin: 11, col: ring, row: 1}
  ring_2: {pin: 10, col: ring, row: 2}
  ring_3: {pin: 9, col: ring, row: 3}
  ring_4: {pin: 8, col: ring, row: 4}
  ring_5: {pin: 7, col: ring, row: 5}
  middle_1: {pin: 17, col: middle, row: 1}
  middle_2: {pin: 16, col: middle, row: 2}
  middle_3: {pin: 15, col: middle, row: 3}
  middle_4: {pin: 14, col: middle, row: 4}
  middle_5: {pin: 13, col: middle, row: 5}
  index_1: {pin: 26, col: index, row: 1}
  index_2: {pin: 25, col: index, row: 2}
  index_3: {pin: 24, col: index, row: 3}
  index_4: {pin: 23, col: index, row: 4}
  index_5: {pin: 22, col: index, row: 5}
  pinky_side: {pin: 6, col: side, row: 3, side: outer}
  index_side: {pin: 27, col: side, row: 3, side: inner}
  thumb_up: {pin: 36, col: thumb, row: 1, cluster: pad}
  thumb_left: {pin: 33, col: thumb, row: 2, cluster: pad}
  thumb_center: {pin: 37, col: thumb, row: 2, cluster: pad}
  thumb_right: {pin: 35, col: thumb, row: 2, cluster: pad}
  thumb_down: {pin: 34, col: thumb, row: 3, cluster: pad}
  thumb_aux_upper: {pin: 20, col: thumb, row: 1, cluster: aux}
  thumb_aux_lower: {pin: 19, col: thumb, row: 2, cluster: aux}
  # Pressing the thumbstick in. The app screenshot suggested a key "below the stick";
  # the press test showed pin 32 is the stick click itself.
  stick_press: {pin: 32, col: thumb, row: 3, cluster: stick}
  stick: {pin: 31, pin_two: 30, col: thumb, row: 0, kind: stick}
